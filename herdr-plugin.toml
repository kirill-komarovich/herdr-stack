id = "herdr-stack"
name = "Dev stack"
version = "0.0.4"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

# Lands the binary where the panes below run it from, so an installed checkout and a linked working
# tree look the same to them.
[[build]]
command = ["sh", "scripts/fetch-binary.sh"]

# A plugin pane's cwd is the plugin root, so the argv is relative and needs no PATH. The log to follow
# arrives as HERDR_STACK_LOG at open time: one entrypoint serves every unit.
[[panes]]
id = "tail"
title = "dev-stack log"
placement = "tab"
command = ["./target/release/herdr-stack", "tail"]

# The unit to type at arrives as HERDR_STACK_PROJECT and HERDR_STACK_UNIT at open time, for the same
# reason: one entrypoint serves every unit.
[[panes]]
id = "attach"
title = "dev-stack attach"
placement = "tab"
command = ["./target/release/herdr-stack", "attach"]
