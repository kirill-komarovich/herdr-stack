[package]
name = "herdr-stack"
version = "0.0.2"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde_json = "1.0.140"
sha2 = "0.10.9"
toml_edit = "0.22.27"

[features]
# Gates the tests that belong in tests/container/Dockerfile only: herdr servers of their own, and
# real shells running real mise and direnv hooks.
container-tests = []

[[test]]
name = "herdr"
required-features = ["container-tests"]

[[test]]
name = "shells"
required-features = ["container-tests"]

[profile.release]
strip = true
