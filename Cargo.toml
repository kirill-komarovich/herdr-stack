[package]
name = "herdr-stack"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde_json = "1.0.140"
sha2 = "0.10.9"
toml_edit = "0.22.27"

[features]
# Gates the tests that start herdr servers of their own: they belong in tests/herdr/Dockerfile only.
herdr-tests = []

[[test]]
name = "herdr"
required-features = ["herdr-tests"]

[profile.release]
strip = true
