name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The suite asks a docker CLI with its compose plugin about a daemon that is not there. Ubuntu
      # runners already have both.
      - if: runner.os == 'macOS'
        run: |
          brew install docker docker-compose
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
      - run: cargo test --locked

  container:
    strategy:
      fail-fast: false
      matrix:
        # The oldest is the manifest's min_herdr_version.
        herdr: ["0.8.0", "0.9.3"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tests/container/run.sh ${{ matrix.herdr }}
